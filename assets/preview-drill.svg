<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="AdminCartograph drill view: focused Admin1 with neighbours dimmed">
  <title>AdminCartograph drill view</title>

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="dropShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2933" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="460" fill="url(#bg2)"/>

  <!-- Dimmed neighbours (outline + faint fill) -->
  <g stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round" opacity="0.45">
    <path d="M 60 90 L 280 60 L 270 220 L 110 240 Z" fill="#e3e6eb"/>
    <path d="M 580 100 L 750 130 L 740 250 L 600 240 Z" fill="#e3e6eb"/>
    <path d="M 90 360 L 270 360 L 290 410 L 110 410 Z" fill="#e3e6eb"/>
    <path d="M 540 360 L 720 360 L 740 410 L 560 410 Z" fill="#e3e6eb"/>
  </g>

  <!-- Neighbour labels (dimmed, near border) -->
  <g font-family="Segoe UI, sans-serif" font-size="11" fill="#5e6873" opacity="0.65" text-anchor="middle">
    <text x="240" y="195">Neighbour A</text>
    <text x="610" y="220">Neighbour B</text>
    <text x="200" y="395">Neighbour C</text>
    <text x="640" y="395">Neighbour D</text>
  </g>

  <!-- Focused Admin1 with its Admin2 areas -->
  <g filter="url(#dropShadow2)" stroke="#1f2933" stroke-width="1.5" stroke-linejoin="round">
    <!-- Admin1 outer outline (thicker border) -->
    <path d="M 280 70 L 580 80 L 600 360 L 250 370 Z" fill="none" stroke="#1f2933" stroke-width="3"/>
    <!-- Admin2 polygons inside -->
    <path d="M 285 80 L 410 78 L 420 200 L 290 200 Z" fill="#deebf7" stroke="#888" stroke-width="1"/>
    <path d="M 410 78 L 575 90 L 580 195 L 420 200 Z" fill="#9ecae1" stroke="#888" stroke-width="1"/>
    <path d="M 290 200 L 420 200 L 430 300 L 280 305 Z" fill="#4292c6" stroke="#888" stroke-width="1"/>
    <path d="M 420 200 L 580 195 L 590 295 L 430 300 Z" fill="#2171b5" stroke="#888" stroke-width="1"/>
    <path d="M 280 305 L 430 300 L 590 295 L 600 360 L 250 365 Z" fill="#08519c" stroke="#888" stroke-width="1"/>
  </g>

  <!-- Admin2 labels -->
  <g font-family="Segoe UI, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="500">
    <text x="350" y="140">Locality 1</text>
    <text x="495" y="140">Locality 2</text>
    <text x="355" y="260">Locality 3</text>
    <text x="500" y="255">Locality 4</text>
    <text x="425" y="335" fill="#ffffff">Locality 5</text>
  </g>

  <!-- Bubbles at the locality level -->
  <g stroke="#ffffff" stroke-width="2">
    <circle cx="350" cy="115" r="14" fill="#e6550d" fill-opacity="0.85"/>
    <circle cx="500" cy="115" r="22" fill="#e6550d" fill-opacity="0.85"/>
    <circle cx="350" cy="240" r="18" fill="#e6550d" fill-opacity="0.85"/>
    <circle cx="500" cy="235" r="11" fill="#fdae6b" fill-opacity="0.85"/>
  </g>

  <!-- Top-bar: back button + nav arrows + title pill -->
  <g font-family="Segoe UI, sans-serif" font-size="12">
    <rect x="12" y="12" width="120" height="28" rx="4" ry="4" fill="white" stroke="#c8c8c8" stroke-width="1"/>
    <text x="22" y="32" fill="#1f2933">← Country View</text>

    <rect x="138" y="12" width="22" height="28" rx="3" ry="3" fill="white" stroke="#c8c8c8" stroke-width="1"/>
    <text x="149" y="33" text-anchor="middle" fill="#1f2933" font-size="14" font-weight="700">‹</text>

    <rect x="164" y="12" width="22" height="28" rx="3" ry="3" fill="white" stroke="#c8c8c8" stroke-width="1"/>
    <text x="175" y="33" text-anchor="middle" fill="#1f2933" font-size="14" font-weight="700">›</text>
  </g>

  <!-- Title pill (top-left, below bar) -->
  <g filter="url(#dropShadow2)">
    <rect x="12" y="50" width="220" height="60" rx="8" ry="8" fill="white" stroke="#9aa0a6" stroke-width="1"/>
    <text x="26" y="80" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#1f2933">Khartoum State</text>
    <text x="26" y="100" font-family="Segoe UI, sans-serif" font-size="15" fill="#444444">5,400,000</text>
  </g>
</svg>
