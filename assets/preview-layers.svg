<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="AdminCartograph visualization stack">
  <title>AdminCartograph: stacked visualization layers on admin boundaries</title>

  <defs>
    <linearGradient id="canvas-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2933" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="460" fill="url(#canvas-bg)"/>

  <!-- Stylised country with five admin areas (choropleth) -->
  <g filter="url(#dropShadow)" stroke="#1f2933" stroke-width="2" stroke-linejoin="round">
    <path d="M 100 80 L 360 50 L 420 130 L 380 230 L 220 240 L 110 200 Z" fill="#deebf7"/>
    <path d="M 360 50 L 600 70 L 660 180 L 540 220 L 420 130 Z" fill="#9ecae1"/>
    <path d="M 220 240 L 380 230 L 540 220 L 480 360 L 250 380 Z" fill="#4292c6"/>
    <path d="M 110 200 L 220 240 L 250 380 L 130 380 Z" fill="#2171b5"/>
    <path d="M 540 220 L 660 180 L 700 280 L 620 380 L 480 360 Z" fill="#08519c"/>

    <!-- Internal admin labels -->
    <g font-family="Segoe UI, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" stroke="none" font-weight="600">
      <text x="245" y="148">Region A</text>
      <text x="500" y="142">Region B</text>
      <text x="375" y="305">Region C</text>
      <text x="180" y="305">Region D</text>
      <text x="600" y="295">Region E</text>
    </g>
  </g>

  <!-- Bubble overlay on three regions -->
  <g stroke="#1f2933" stroke-width="2" opacity="0.92">
    <circle cx="500" cy="160" r="42" fill="#e6550d" fill-opacity="0.78"/>
    <circle cx="245" cy="170" r="22" fill="#fdae6b" fill-opacity="0.78"/>
    <circle cx="375" cy="320" r="32" fill="#e6550d" fill-opacity="0.78"/>
  </g>

  <!-- Pie/donut overlay on one region -->
  <g transform="translate(600,295)" filter="url(#dropShadow)">
    <path d="M 0 -34 A 34 34 0 0 1 32 11 L 0 0 Z" fill="#1f77b4" stroke="white" stroke-width="2"/>
    <path d="M 32 11 A 34 34 0 0 1 -22 26 L 0 0 Z" fill="#ff7f0e" stroke="white" stroke-width="2"/>
    <path d="M -22 26 A 34 34 0 0 1 0 -34 L 0 0 Z" fill="#2ca02c" stroke="white" stroke-width="2"/>
  </g>

  <!-- Right-side legend stack -->
  <g transform="translate(700,40)" font-family="Segoe UI, sans-serif" font-size="11" fill="#1f2933">
    <rect x="-10" y="-12" width="86" height="120" rx="6" ry="6" fill="white" fill-opacity="0.95" stroke="#cccccc" stroke-width="1"/>
    <text x="0" y="2" font-weight="600" font-size="12">Population</text>
    <g transform="translate(0,12)">
      <rect x="0" y="0" width="14" height="14" fill="#deebf7" stroke="#666" stroke-width="0.5"/>
      <rect x="0" y="18" width="14" height="14" fill="#9ecae1" stroke="#666" stroke-width="0.5"/>
      <rect x="0" y="36" width="14" height="14" fill="#4292c6" stroke="#666" stroke-width="0.5"/>
      <rect x="0" y="54" width="14" height="14" fill="#2171b5" stroke="#666" stroke-width="0.5"/>
      <rect x="0" y="72" width="14" height="14" fill="#08519c" stroke="#666" stroke-width="0.5"/>
      <text x="20" y="11">0–500K</text>
      <text x="20" y="29">500K–1M</text>
      <text x="20" y="47">1M–2M</text>
      <text x="20" y="65">2M–5M</text>
      <text x="20" y="83">5M+</text>
    </g>
  </g>

  <!-- Scale bar -->
  <g transform="translate(40,420)" font-family="Segoe UI, sans-serif" font-size="11" fill="#1f2933">
    <rect x="0" y="-6" width="50" height="6" fill="white" stroke="#1f2933" stroke-width="1"/>
    <rect x="50" y="-6" width="50" height="6" fill="#1f2933" stroke="#1f2933" stroke-width="1"/>
    <line x1="0" y1="-10" x2="0" y2="0" stroke="#1f2933" stroke-width="1"/>
    <line x1="50" y1="-10" x2="50" y2="0" stroke="#1f2933" stroke-width="1"/>
    <line x1="100" y1="-10" x2="100" y2="0" stroke="#1f2933" stroke-width="1"/>
    <text x="0" y="14">0</text>
    <text x="100" y="14" text-anchor="end">100 km</text>
  </g>

  <!-- Label callouts on top -->
  <g font-family="Segoe UI, sans-serif" font-size="11" fill="#5e6873">
    <text x="20" y="32">Choropleth fill</text>
    <line x1="100" y1="35" x2="170" y2="120" stroke="#5e6873" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="540" y="32" font-weight="500">Bubble overlay</text>
    <line x1="540" y1="40" x2="498" y2="125" stroke="#5e6873" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="690" y="395" text-anchor="end" font-weight="500">Pie overlay</text>
    <line x1="640" y1="390" x2="610" y2="320" stroke="#5e6873" stroke-width="1" stroke-dasharray="3,3"/>
  </g>
</svg>
